server.port=${PORT:5001}
server.address=0.0.0.0
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.database.type=${APP_DATABASE_TYPE:SQLite}
app.jwt.secret=${JWT_SECRET:college-event-management-spring-boot-jwt-secret-key-2026-min-32-chars}
app.jwt.expiration-ms=43200000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
